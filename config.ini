[scan]
ip_range = 127.0.0.1       ; Fallback IP range if iprange.txt is not found or empty
scan_speed = 10000
timeout = 5
ports = 1080,3128,8080,8888,9999,80,443,8000,8081
test_url = http://httpbin.org/ip
https_test_url = https://api.ipify.org
masscan_args =
ip_range_file = iprange.txt ; File to read multiple IP ranges from (one per line)
